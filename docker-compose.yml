services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  # The API and the web client in one container. Start it with:
  #   docker compose --profile app up -d --build
  # Without the profile only Qdrant runs, which is how the app is developed locally.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      # Ollama runs on the host or another machine, not in this stack.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:latest}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data

volumes:
  qdrant_storage:
  app_data:
